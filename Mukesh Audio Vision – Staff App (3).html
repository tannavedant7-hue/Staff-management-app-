<style>

.sheet{--ink:#EAF7F5;--mut:#B3D6D2;--line:rgba(255,255,255,.22);--card:rgba(255,255,255,.1);--bg:rgba(0,0,0,.3);--teal:#F2A33A;--on:#2B1B00;--red:#FFA08A;color-scheme:dark;color:var(--ink);background:radial-gradient(circle at var(--x1,88%) 6%,rgba(242,163,58,.6),transparent 36%),radial-gradient(circle at 8% var(--y2,92%),rgba(63,184,174,.55),transparent 42%),radial-gradient(circle at var(--x3,72%) 78%,rgba(200,68,47,.3),transparent 34%),radial-gradient(ellipse at 20% 30%,rgba(120,90,220,.28),transparent 40%),conic-gradient(from calc(200deg + var(--a,0deg)) at 78% 22%,transparent 0,rgba(242,163,58,.26) 12%,transparent 30%,rgba(63,184,174,.24) 55%,transparent 75%),radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.7px) var(--d,0px) var(--d,0px)/24px 24px,repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 38px),linear-gradient(160deg,#04191F,#0B4A46 55%,#10243F)}

@keyframes glow{0%{text-shadow:0 0 0 rgba(242,163,58,0)}40%{text-shadow:0 0 28px rgba(242,163,58,.95),0 0 60px rgba(63,184,174,.6)}100%{text-shadow:0 0 18px rgba(242,163,58,.5)}}

.fab{background:linear-gradient(135deg,#FFC766,#F2A33A 55%,#E0821A);display:flex;align-items:center}

.iw{display:block;white-space:nowrap}.iw span{display:inline-block}

.sw{position:absolute;top:0;bottom:0;left:0;width:34%;display:block;opacity:0;background:linear-gradient(100deg,transparent,rgba(242,163,58,.18),rgba(255,226,170,.32),rgba(242,163,58,.18),transparent);mix-blend-mode:screen;transform:translateX(-130%) skewX(-12deg)}

@keyframes orbit{to{transform:rotate(360deg)}}
.aio{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,25,31,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#EAF7F5}

.orb i::before{content:'';position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
.orb i:nth-child(1){inset:-22px}.orb i:nth-child(2){inset:-44px}.orb i:nth-child(3){inset:-66px}
.aio p{margin:84px 0 0;padding:0 20px;font-size:20px;font-weight:600;letter-spacing:.02em;text-align:center}
@media(prefers-reduced-motion:reduce){.aio{animation:out .3s ease .7s forwards}}
@media(prefers-reduced-motion:reduce){#intro{animation:out .4s ease 1.3s forwards}}
@media(prefers-reduced-motion:no-preference){
.sheet{animation:spin 40s linear infinite,dots 8s linear infinite,drift 16s ease-in-out infinite alternate,open .65s cubic-bezier(.2,.8,.2,1) both}
.fab{animation:float 3.6s ease-in-out infinite}
.fab::before,.fab::after{animation:ring 2.4s ease-out infinite}.fab::after{animation-delay:1.2s}
.wv i{animation:bar .8s ease-in-out infinite alternate}.wv i:nth-child(2){animation-delay:-.3s}.wv i:nth-child(3){animation-delay:-.6s}
#intro{animation:out .6s ease 3.2s forwards}
.iw span{animation:rise .75s cubic-bezier(.2,.8,.2,1) calc(var(--i)*55ms) both,wave 1s ease-in-out calc(1.5s + var(--i)*60ms) 2}
.it{animation:glow 1.3s ease-out 2.4s both}
.eq{animation:fade .6s ease .6s both}.eq b{animation:bar .7s ease-in-out calc(var(--i)*-70ms) infinite alternate}
.sw{animation:sweep 1.1s cubic-bezier(.5,0,.2,1) 2.3s forwards}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(107,227,164,.75)}100%{box-shadow:0 0 0 10px rgba(107,227,164,0)}}
@keyframes tick{from{transform:scale(.94)}}
.fx{animation:up .55s cubic-bezier(.2,.8,.2,1) calc(var(--n)*80ms) both}
.ok{animation:up .3s ease both}
.chip.on i{animation:pulse 1.6s ease-out infinite}
.eqh i{animation:bar .9s ease-in-out infinite alternate}.eqh i:nth-child(2n){animation-delay:-.3s}.eqh i:nth-child(3n){animation-delay:-.6s}
.ph.got{animation:tick .35s cubic-bezier(.2,1.4,.4,1)}
.aio{animation:out .5s ease 1.9s forwards}
.orb{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both,morph 2s ease-in-out infinite}
.orb i{animation:orbit 2.2s linear infinite}.orb i:nth-child(2){animation:orbit 3.2s linear infinite reverse}.orb i:nth-child(3){animation:orbit 4.4s linear infinite}
.aio p span{animation:fade .3s ease calc(.6s + var(--i)*45ms) both}}
.sheet .li{border-color:var(--line)}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px 18px 18px;margin:0 0 14px;color:#fff;background:radial-gradient(circle at 90% 10%,rgba(242,163,58,.55),transparent 45%),linear-gradient(135deg,#0E6B66,#083F3C 75%)}
.hi{font-size:15px;opacity:.85}.hn{font-size:28px;font-weight:700;line-height:1.1;margin:2px 0 12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600;font-size:15px}
.chip i{width:9px;height:9px;border-radius:50%;background:#C9D6D4}.chip.on i{background:#6BE3A4}
.eqh{position:absolute;right:16px;bottom:16px;display:flex;gap:4px;align-items:flex-end;height:38px;opacity:.55}
.eqh i{width:4px;height:100%;border-radius:2px;background:#F2A33A;transform:scaleY(.45);transform-origin:bottom}
.evt{font-size:22px;font-weight:700;line-height:1.2;margin-bottom:4px}
.map{display:inline-block;margin-top:10px;padding:9px 14px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);color:var(--teal);font-weight:700;text-decoration:none}
.step{display:flex;gap:8px}.step input{text-align:center;font-weight:700;font-size:20px}
.sb{width:56px;flex:none;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;font-size:24px;font-weight:700}
.ph{display:block;margin:12px 0 0;padding:20px 12px;text-align:center;border:2px dashed var(--line);border-radius:12px;color:var(--mut);font-weight:600}
.ph.got{border-style:solid;border-color:var(--teal);color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.ch{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600}
.b.dim{background:transparent;color:var(--teal);border:2px solid var(--teal)}.b.a.dim{color:var(--ink);border-color:var(--amb)}.b:active,.sb:active,.ch:active{transform:scale(.96)}
.pv{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--amb);color:#2B1B00;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:15px}.pv .l{color:#2B1B00;white-space:nowrap}
.ok{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:6}
.ok.bad{background:#B83A26;color:#fff}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.l{min-height:44px;min-width:44px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ph:has(+.vh:focus-visible){outline:3px solid var(--amb);outline-offset:2px}
.sk{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:0;font-size:14px;opacity:.75}
.tw{overflow-x:auto}
.b.lis{background:var(--red);color:#fff}
</style></head><body><main id="app"></main><div id="aiw"></div><div id="intro" aria-hidden="true"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const g=i=>document.getElementById(i),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10),rs=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const S={uid:"demo",me:null,wk:[],ev:[],st:[],lg:[],mv:[],lv:[],dc:{},pf:{},ak:[],lk:{},fin:{},tab:"Events",msg:"",err:"",photo:false,cur:""};
let db,boss=false,uns=[];
function playIntro(){let n=g("intro");if(!n){n=document.createElement("div");n.id="intro";n.setAttribute("aria-hidden","true");document.body.appendChild(n)}
 const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 n.innerHTML=`<div class="it">${["MUKESH","AUDIO","VISION"].map((w,k)=>`<div class="iw">${[...w].map((c,i)=>`<span style="--i:${i+k*7}">${c}</span>`).join("")}</div>`).join("")}</div><div class="eq">${Array.from({length:23},(_,i)=>`<b style="--i:${i}"></b>`).join("")}</div><i class="sw"></i><p class="sk">Tap to skip</p>`;
 n.onclick=()=>n.remove();setTimeout(()=>n.remove(),rm?1800:3800)}
playIntro();let hid=0;document.addEventListener("visibilitychange",()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>15000){hid=0;playIntro()}});
function mock(){const d={},ls=[],run=f=>{ls.push(f);f();return()=>{const i=ls.indexOf(f);if(i>=0)ls.splice(i,1)}},fire=()=>ls.slice().forEach(f=>f());
 const pt=(p,id,x)=>{(d[p]=d[p]||{})[id]=x;fire()};
 return{collection(p){return{doc(id){return{set:async x=>pt(p,id,x),update:async x=>pt(p,id,{...(d[p]||{})[id],...x})}},
 onSnapshot(cb){return run(()=>cb({docs:Object.keys(d[p]||{}).map(id=>({id,data:()=>d[p][id]}))}))}}},
 doc(path){const[p,id]=path.split("/");return{set:async x=>pt(p,id,x),onSnapshot(cb){return run(()=>cb({exists:!!(d[p]&&d[p][id]),data:()=>(d[p]||{})[id]}))}}}}}
const col=n=>db.collection(n),put=(c,i,x)=>col(c).doc(i).set(x);
(async()=>{
 let user=null;
 try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
 if(db&&user){boss=!!(await user.canEdit());S.uid=await user.id()}else{db=mock();S.demo=true;S.uid="wA";seed()}
 sub();draw();
})();
function sub(){
 uns.forEach(u=>u());uns=[];
 const er=c=>()=>{S.err="Could not load "+c+". Check your connection."};
 const on=(c,f)=>uns.push(col(c).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));draw()},er(c)));
 on("workers",a=>{S.wk=a;S.me=a.find(w=>w.id==S.uid)||null});on("events",a=>S.ev=a);on("stock",a=>S.st=a);on("moves",a=>S.mv=flat(a));on("links",a=>S.lk=Object.fromEntries(a.map(d=>[d.id,d])));on("decisions",a=>S.dc=Object.fromEntries(a.map(d=>[d.id,d])));
 if(boss){on("leaves",a=>S.lv=flat(a));on("acks",a=>S.ak=flat(a));on("profiles",a=>S.pf=Object.fromEntries(a.map(d=>[d.id,d])));on("logs",a=>S.lg=flat(a));on("finance",a=>S.fin=Object.fromEntries(a.map(f=>[f.id,f.value])))}
 else{const me=S.uid;uns.push(db.doc("logs/"+me).onSnapshot(s=>{S.lg=flat(s.exists?[{id:me,...s.data()}]:[]);draw()},er("logs")));uns.push(db.doc("leaves/"+me).onSnapshot(s=>{S.lv=flat(s.exists?[{id:me,...s.data()}]:[]);draw()},er("leaves")));uns.push(db.doc("acks/"+me).onSnapshot(s=>{S.ak=flat(s.exists?[{id:me,...s.data()}]:[]);draw()},er("acks")))}
}
function flat(a){return a.flatMap(d=>(d.items||[]).map(x=>({...x,workerId:d.id})))}
function outQ(id){return S.mv.filter(m=>m.itemId==id).reduce((n,m)=>n+(m.dir=="out"?m.qty:-m.qty),0)}
function left(i){return i.total-outQ(i.id)}
async function addTo(c,x){const A=c=="moves"?S.mv:c=="leaves"?S.lv:c=="acks"?S.ak:S.lg,it={...x,eventId:x.eventId||S.cur,at:Date.now(),day:today(),workerName:S.me?.name||""};
 const old=A.filter(r=>r.workerId==S.uid).map(({workerId,...r})=>r);A.push({...it,workerId:S.uid});
 await put(c,S.uid,{items:[...old,it]})}
function seed(){const t=today();
 put("workers","wA",{name:"Worker A",agreedAt:Date.now()});put("workers","wB",{name:"Worker B",agreedAt:Date.now()});
 put("stock","s1",{name:"Speaker",total:6});put("stock","s2",{name:"Cable",total:10});
 put("events","e1",{title:"Wedding Reception",venue:"Hotel Grand, Indore",date:t,workerId:"wA",workerName:"Worker A"});
 put("events","e2",{title:"College Fest",venue:"City Auditorium, Indore",date:t,workerId:"wB",workerName:"Worker B"});
 put("finance","e1",{value:40000});put("finance","e2",{value:25000})}
function mine(){const t=today(),r=[...S.lg.filter(l=>l.workerId==S.uid&&l.day==t).map(l=>({at:l.at,t:l.type=="expense"?"Expense: "+l.text:l.type=="in"?"Checked in":"Checked out",v:l.type=="expense"?rs(l.amount):""})),...S.ak.filter(k=>k.workerId==S.uid&&k.day==t).map(k=>({at:k.at,t:"Accepted: "+((S.ev.find(e=>e.id==k.eventId)||{}).title||"event"),v:""})),...S.mv.filter(m=>m.workerId==S.uid&&m.day==t).map(m=>({at:m.at,t:(m.dir=="out"?"Took ":"Returned ")+m.qty+" × "+m.name,v:""}))].sort((a,b)=>b.at-a.at);
 return`<div class="c${S.anim?" fx":""}" style="--n:6"><h2>My records today</h2>${r.length?r.map(x=>`<div class="li"><span>${esc(x.t)}</span><b>${esc(x.v)}</b></div>`).join(""):`<p class="m">Nothing logged yet today.</p>`}</div>`}
function draw(){
 const v={},a=document.activeElement?.id;
 document.querySelectorAll("#app [id]").forEach(e=>{if(e.type=="checkbox")v[e.id]=e.checked;else if("value"in e&&e.type!="file")v[e.id]=e.value});
 g("app").innerHTML=view();
 for(const k in v){const e=g(k);if(e){if(e.type=="checkbox")e.checked=v[k];else e.value=v[k]}}
 if(a&&g(a)&&g(a).type!="file")g(a).focus();
 ai();if(S.err){clearTimeout(S.et);S.et=setTimeout(()=>{S.err="";draw()},6000)}
}
function view(){
 let h=`<header><h1 style="font-size:19px;margin:0">Mukesh Audio Vision</h1><span>${boss?"Boss":esc(S.me?.name||"Staff")}</span></header>`;

let rec=null;
function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){S.err="Voice input is not supported in this browser. You can type your question instead.";return draw()}
 if(S.lis&&rec){rec.stop();return}
 try{speechSynthesis.cancel()}catch(x){}
 rec=new SR();rec.lang=S.vl||"en-IN";rec.interimResults=true;rec.continuous=false;S.err="";S.lis=true;draw();
 rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join("");if(g("aq"))g("aq").value=t;S.heard=true};
 rec.onerror=e=>{S.lis=false;S.heard=false;S.err=(e.error=="not-allowed"||e.error=="service-not-allowed")?"The microphone is blocked here. Allow the mic for this page, or type your question.":e.error=="no-speech"?"I did not hear anything. Tap the mic and try again.":"Voice input did not work. Try again or type your question.";draw()};
 rec.onend=()=>{S.lis=false;draw();const q=g("aq")&&g("aq").value.trim();if(q&&S.heard){S.heard=false;S.byVoice=true;const b=document.querySelector('[data-a="ask"]');if(b)b.click()}};
 try{rec.start()}catch(x){S.lis=false;S.err="Could not start the microphone.";draw()}}
function speak(t){if(!(S.byVoice||S.vs)||!window.speechSynthesis)return;S.byVoice=false;
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[*#_`]/g,""));u.lang=S.vl||"en-IN";
 u.onstart=()=>{S.talk=true;draw()};u.onend=u.onerror=()=>{S.talk=false;draw()};speechSynthesis.speak(u)}
function stopTalk(){try{speechSynthesis.cancel()}catch(x){}S.talk=false;draw()}
const say=m=>{S.msg=m;try{navigator.vibrate&&navigator.vibrate(25)}catch(x){}draw();setTimeout(()=>{S.msg="";draw()},3000)};
const log=x=>addTo("logs",x);
document.addEventListener("change",e=>{if(e.target.id=="vl")S.vl=e.target.value;else if(e.target.id=="vs")S.vs=e.target.checked;else if(e.target.dataset.a=="ph"){S.photo=!!e.target.files.length;draw()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&S.ai){S.ai=false;draw()}});
document.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(S.prev&&["att","mv","ex","reg","lreq"].includes(a)){say("Preview only, nothing saved");return}
 try{
  if(a=="role"){S.prev=false;boss=v=="b";if(!boss)S.uid=v;S.wDone=false;S.err="";sub();draw()}
  else if(a=="tab"){S.tab=v;draw()}
  else if(a=="pv"){sandbox(!S.sbx)}
  else if(a=="aw"){asWorker(!S.aw)}
  else if(a=="lk"){await put("links",v,{uid:b.dataset.id});say("Name confirmed ✓")}
  else if(a=="acc"){await addTo("acks",{eventId:b.dataset.id});say("Event accepted ✓")}
  else if(a=="qty"){const i=g("sq");i.value=Math.max(1,(Number(i.value)||1)+Number(v))}
  else if(a=="chip"){g("et").value=v;g("ea").focus()}
  else if(a=="ai"){S.ai=!S.ai;S.err="";if(!S.ai){try{speechSynthesis.cancel();rec&&rec.abort()}catch(x){}S.talk=false;S.lis=false}draw()}
  else if(a=="mic"){listen()}
  else if(a=="stopv"){stopTalk()}
  else if(a=="reg"){const n=g("nm").value.trim(),bd=g("nb").value,ph=g("np").value.replace(/\D/g,"");
   if(!n||!bd||ph.length<10||!g("ag").checked){S.err="Enter your name, birth date and a 10 digit phone number, and tick “I agree”.";return draw()}
   S.err="";await put("profiles",S.uid,{dob:bd,phone:ph,village:g("nv").value.trim(),emergency:g("ne").value.replace(/\D/g,"")});
   await put("workers",S.uid,{name:n,claim:g("nc")?g("nc").value:"",agreedAt:Date.now()})}
  else if(a=="lreq"){const f=g("lf").value,t=g("lt").value,r=g("lr").value.trim();if(!f||!t||t<f||(new Date(t)-new Date(f))>365*864e5||!r){S.err="Choose the dates and write a reason.";return draw()}
   S.err="";await addTo("leaves",{id:uid(),from:f,to:t,reason:r});g("lr").value="";say("Leave request sent ✓")}
  else if(a=="lv"){const id=b.dataset.id,nt=g("ln-"+id);await put("decisions",id,{status:v,note:nt?nt.value.trim():"",at:Date.now()});say(v=="approved"?"Leave approved ✓":"Leave declined")}
  else if(a=="addw"){const n=g("wn").value.trim();if(!n){S.err="Enter the worker’s name.";return draw()}S.err="";await put("workers",uid(),{name:n,added:true});g("wn").value="";say("Worker added ✓")}
  else if(a=="att"){await log({type:v});say(v=="in"?"Checked in ✓":"Checked out ✓")}
  else if(a=="ex"){const t=g("et").value.trim(),n=Number(g("ea").value);if(!t||!(n>0&&n<=1000000)){S.err="Enter what the expense was for and an amount up to ₹10,00,000.";return draw()}S.err="";await log({type:"expense",text:t,amount:n});g("et").value=g("ea").value="";say("Expense sent ✓")}
  else if(a=="mv"){const it=S.st.find(s=>s.id==g("si").value),q=Number(g("sq").value);if(!it||!(Number.isInteger(q)&&q>0&&q<=1000)){S.err="Pick an item and a whole-number quantity up to 1000.";return draw()}
   if(!S.photo){S.err="Add a photo of the items first.";return draw()}
   if(v=="in"&&q>outQ(it.id)){S.err="Only "+outQ(it.id)+" of this item are out of the godown.";return draw()}
   if(v=="out"&&q>left(it)){S.err="Only "+left(it)+" left in the godown.";return draw()}
   S.err="";await addTo("moves",{itemId:it.id,name:it.name,qty:q,dir:v});S.photo=false;say(v=="out"?"Marked as taken out ✓":"Marked as returned ✓")}
  else if(a=="ask"){const q=g("aq").value.trim();if(!q){S.err="Type a question first.";return draw()}
   const sm=typeof claude=="undefined"?null:await claude.use("sample");if(!sm){S.err="The AI assistant is not available here. Open the app from your Claude link.";return draw()}
   S.err="";S.busy=true;S.ans="";draw();
   try{const r=await sm(ctx(q),{cache:false,onText:t=>{S.ans=t.text;draw()}});S.ans=r.text;speak(r.text)}catch(x){S.err=x.code=="not_granted"?"Allow the AI assistant when asked, then try again.":"The AI could not answer now. Try again in a minute."}
   S.busy=false;draw()}
  else if(a=="addev"){const t=g("bt").value.trim(),w=S.wk.find(x=>x.id==g("bw").value);if(!t||!w){S.err="Enter the event name and choose a registered worker.";return draw()}
   const i=uid();S.err="";await put("events",i,{title:t,venue:g("bv").value.trim(),date:g("bd").value,workerId:w.id,workerName:w.name});await put("finance",i,{value:Math.min(100000000,Math.max(0,Number(g("bm").value)||0))});g("bt").value=g("bv").value=g("bm").value="";say("Event assigned ✓")}
  else if(a=="addst"){const n=g("sn").value.trim(),q=Number(g("st").value);if(!n||!(Number.isInteger(q)&&q>0&&q<=100000)){S.err="Enter the item name and a whole-number quantity.";return draw()}S.err="";await put("stock",uid(),{name:n,total:q});g("sn").value=g("st").value="";say("Item added ✓")}
 }catch(x){S.err="Could not save. You may not have permission for this.";draw()}
});
</script></body></html>
